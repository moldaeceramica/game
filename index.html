<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ateliê Virtual de Cerâmica</title>
<style>
:root{--fg:#eaf0ee;--ac:#7fb8a0;--pn:rgba(18,26,32,.88);--go:#3f7f9a;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:#141b20;color:var(--fg);font:15px/1.4 system-ui,sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;text-align:center;pointer-events:none;text-shadow:0 1px 4px #000}
#hud b{font:600 18px Georgia,serif}#stat{font-size:13px;opacity:.9}
#ui{position:fixed;bottom:0;left:0;right:0;padding:24px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--pn) 35%)}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:5px 0;align-items:center}
button{background:rgba(255,255,255,.1);color:var(--fg);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 11px;font:inherit;touch-action manipulation}
button.on{background:var(--ac);color:#10201a;border-color:var(--ac)}button.go{background:var(--go);border-color:var(--go)}
input[type=range]{width:130px;accent-color:var(--ac)}
.sw{width:34px;height:34px;padding:0;border-radius:50%}.sw.on{outline:3px solid #fff}
#gauge{position:relative;height:14px;background:#0008;border-radius:7px;margin:4px 6px;overflow:hidden}
#gauge i{position:absolute;top:0;bottom:0;display:block}
#msg{position:fixed;top:30%;left:8%;right:8%;text-align:center;font:600 18px Georgia,serif;background:var(--pn);padding:14px;border-radius:12px;opacity:0;transition:opacity .4s;pointer-events:none}
#kp{background:#0a0e11ee;border:1px solid #38454f;border-radius:14px;padding:8px 10px;max-width:420px;margin:0 auto}
.kh{display:flex;gap:8px;align-items:center;font-size:13px}.kh span:last-child{margin-left:auto;opacity:.7}
.led{width:10px;height:10px;border-radius:50%;background:#444}
.kg{display:flex;align-items:center;gap:10px;margin:6px 0}.lcd{font:700 36px/1 ui-monospace,monospace;color:#7dffb0;background:#04100a;padding:4px 10px;border-radius:8px;text-shadow:0 0 8px #3f9}.lcd small{font-size:15px}
.ph{font-size:13px;flex:1}.bl{font-size:11px;opacity:.7;margin-top:4px}
.bar{position:relative;height:10px;background:#1b252c;border-radius:5px;overflow:hidden}.bar i{position:absolute;top:0;bottom:0;display:block}
#ch{width:100%;height:50px;background:#0c1418;border-radius:6px;margin-top:6px}
.sws{flex-wrap:nowrap!important;overflow-x:auto;justify-content:flex-start!important}.sw{flex:none}
#lg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;width:44px;height:44px;border-radius:50%;box-shadow:0 1px 6px #0008;z-index:5}
#mu{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:5;font-size:18px;padding:5px 9px}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:14vh 24px calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 35%,#34454f,#141b20 70%)}
.mt{font:600 38px/1.1 Georgia,serif;margin-bottom:12px}#menu p{opacity:.8;max-width:300px;margin:0 auto 24px}#menu button{padding:12px 26px;font-size:17px}
.mf{display:flex;gap:10px;align-items:center;opacity:.65;font-size:13px;text-align:left}#menu #lg{position:static;width:40px;height:40px;box-shadow:none}
.jar{width:66px;padding:2px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}.jar .lid{display:block;width:30px;height:7px;background:#3a3f44;border-radius:3px 3px 0 0}
.jar b{display:block;width:44px;height:38px;border-radius:6px 6px 10px 10px;border:2px solid #ffffff55;box-shadow:inset 0 -8px 10px #0004,inset 5px 0 6px #fff3}.jar small{font-size:10px;line-height:1.1;text-align:center}.jar.on{outline:2px solid #fff;background:#fff2}
#menu #lg{width:110px;height:110px}.mf{opacity:.9;font-size:16px;gap:14px}

function snapP(){const r={rad:Float32Array.from(rad),hh,w,f,ty:mode=='mao'?3:ptype==3?0:ptype,cl:clay,hd,dc:dc.slice(),glz:glz.slice(),moist,fired,fl,md:mode,rg:mat.roughness,cc:mat.clearcoat};if(cur>=0&&lot[cur])Object.assign(lot[cur],r);else{r.bq='ok';lot.push(r);cur=lot.length-1}}
function ldP(i){const r=lot[i];cur=i;rad.set(r.rad);hh=r.hh;w=r.w;f=r.f;ptype=r.ty;mode=r.md;setClay(r.cl,1);glz=r.glz.slice();moist=r.moist;fired=r.fired;fl=r.fl;mat.roughness=r.rg??.95;mat.clearcoat=r.cc||0;clrDcMesh();dc=[];r.dc.forEach(x=>{dc.push(x);addDc(x)});setH(r.hd,1);upd();colr()}
function newP(){reset();hd=0;setH(0,1);clrDcMesh();dc=[];st=0;tool=mode=='torno'?'centrar':'x';pot.visible=true;if(mode=='mao')initSlab();else{upd();colr()}view();ui()}
function addP(){if(lot.length>=14){msg('Limite de 15 peças por fornada.');return}snapP();cur=-1;newP()}

function dryGo(){drying=1;msg('Secando as peças aos poucos...',2500)}
function x0(){return `<div class=row>${CLAYS.map((c,i)=>`<button class="${clay==i?'on':''}" style="padding:4px 8px;font-size:12px" onclick="setClay(${i});ui()"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#${c[3].toString(16).padStart(6,'0')}"></span> ${c[0]}</button>`).join('')}</div>`+(mode=='torno'?`<div class=row>${['Vaso/tigela','Caneca','Xícara'].map((n,i)=>`<button class="${ptype==i?'on':''}" onclick="ptype=${i};ui()">${n}</button>`).join('')}</div>`:'')}
function ui1(){const hs=ptype==1||ptype==2&&mode=='torno'||ptype==1?`<div class=row><span>Alça:</span>${['Sem','Anel','Orelha','Grande'].map((n,i)=>`<button class="${hd==i?'on':''}" onclick="setH(${i})">${n}</button>`).join('')}</div>`:'';return hs+`<div class=row><span>Carimbo:</span><button class="${stp<0?'on':''}" onclick="stp=-1;ui()">Nenhum</button>${STP.map((s,i)=>`<button class="${stp==i?'on':''}" onclick="stp=${i};ui()">${s[0]}</button>`).join('')}<button onclick="clrDc()">↺</button></div><div style="text-align:center;font-size:12px">Escolha um carimbo e toque na peça. Gire com os botões.</div><div class=row><button onclick="addP()">➕ Nova peça</button><button class=go onclick="dryGo()">☀️ Secar</button><button class=go onclick="toKiln(2)">🔥 Ao forno (${lot.length+(cur<0?1:0)})</button></div>`}
function pchips(){return lot.length>1?`<div class=row>${lot.map((r,i)=>`<button class="${cur==i?'on':''}" onclick="selPiece(${i})">Peça ${i+1}</button>`).join('')}</div>`:''}
function ui5(){return `<div class=row>${lot.map((r,i)=>`<button class="${cur==i?'on':''}" onclick="showR(${i})">Peça ${i+1} · nota ${r.sc}</button>`).join('')}</div><div class=row><button class=go onclick="shelfSave(cur)">⭐ Guardar na prateleira</button><button onclick="C.position.set(0,1.9,0);C.lookAt(0,1.9,-3.2);setTimeout(view,4000)">👀 Ver prateleira</button><button onclick="newBatch()">Nova fornada</button></div>`}
function uiLoad(){return `<div class=row><span>Móvel:</span>${FUR.map((n,i)=>`<button class="${furn==i?'on':''}" onclick="furn=${i};buildKiln();view();kcam();ui()">${n}</button>`).join('')}</div><div class=row>${lot.map((r,i)=>`<button class="${sel==i?'on':''}" onclick="sel=${i};placeAll();ui()">${asg[i]>=0?'':'⚠️ '}Peça ${i+1}</button>`).join('')}</div><div style="text-align:center;font-size:12px">Toque numa peça e depois num círculo verde para movê-la. Andares altos esquentam mais.</div><div class=row><button class=go onclick="fire()">Fechar e acender 🔥</button></div>`}
const _ui3=ui;ui=function(){_ui3();const e=$('ui');if(st==1)e.innerHTML=ui1();else if((st==2||st==4)&&loading)e.innerHTML=uiLoad();else if(st==3)e.insertAdjacentHTML('afterbegin',pchips());else if(st==5)e.innerHTML=ui5();if(st==1||st==3||st==5||(st==0&&mode=='mao'&&ms>=2))e.insertAdjacentHTML('afterbegin','<div class=row><button data-h="-1">⟲ Girar</button><button data-h="1">Girar ⟳</button></div>')};
function zn(){const z=Math.round(zs);return st==2?[900+z,1000+z]:[1040+z,1130+z]}
function kcam(){C.position.set(0,2.2+furn*.55,2.9+furn*.9);C.lookAt(0,.85+furn*.55,0)}
function placeAll(){km.forEach((m,i)=>{const s=asg[i];m.visible=s>=0;if(s>=0){const l=Math.floor(s/5),a=(s%5)/5*6.2832;m.position.set(Math.cos(a)*.8,LY(l),Math.sin(a)*.8)}if(loading)m.material.emissive.setRGB(0,i==sel?.5:0,i==sel?.4:0)})}
function cl2(c,m){const c2=c.clone();c2.material=c.material.clone();m.add(c2)}
function buildKiln(){km.forEach(m=>S.remove(m));slotM.forEach(m=>S.remove(m));km=[];slotM=[];while(furG.children.length)furG.remove(furG.children[0]);const L=furn+1;
for(let l=0;l<L;l++){if(l)mk(new T.CylinderGeometry(1.35,1.35,.05,32),std(0x6a625c),0,LY(l)-.03,0,furG);for(let k=0;k<5;k++){const a=k/5*6.2832,m=new T.Mesh(new T.CylinderGeometry(.3,.3,.02,16),new T.MeshBasicMaterial({color:0x66ccaa,transparent:true,opacity:.3}));m.position.set(Math.cos(a)*.8,LY(l)+.02,Math.sin(a)*.8);m.userData.s=l*5+k;S.add(m);slotM.push(m)}}
for(let l=1;l<L;l++)for(let k=0;k<3;k++){const a=k*2.094;mk(new T.CylinderGeometry(.06,.06,.82,10),std(0x6a625c),Math.cos(a)*1.15,LY(l)-.43,Math.sin(a)*1.15,furG)}
asg=lot.map((_,i)=>i<L*5?i:-1);lot.forEach((r,i)=>{ldP(i);const m=new T.Mesh(geo.clone(),mat.clone());m.scale.setScalar(.5);m.userData.i=i;m.castShadow=true;pot.children.forEach(c=>cl2(c,m));km.push(m);S.add(m)});placeAll()}
function kTap(){rc.setFromCamera(ptr,C);const h=rc.intersectObjects(km.filter(m=>m.visible),false)[0];if(h)sel=h.object.userData.i;else{const s=rc.intersectObjects(slotM,false)[0];if(s&&sel>=0){const t=s.object.userData.s,j=asg.indexOf(t);if(j>=0)asg[j]=asg[sel];asg[sel]=t;sel=-1}}placeAll();ui()}
cv.addEventListener('pointerdown',()=>{tap=true;if(loading&&(st==2||st==4))kTap()});
function syncK(){const a=lot.filter(r=>!r.dead);if(!a.length)return;moist=Math.max(...a.map(r=>r.moist));w=Math.max(...a.map(r=>r.w))}
function toKiln(s){snapP();hist=[];st=s;T0=20;rate=0;power=0;risk=0;pk=20;fi=s==2?0:3;loading=true;sel=-1;furn=Math.min(2,Math.ceil(lot.length/5)-1);pot.visible=false;buildKiln();view();kcam();ui()}
function fire(){if(asg.some(a=>a<0)){msg('Nem todas as peças cabem: escolha um móvel com mais andares.');return}loading=false;slotM.forEach(m=>m.visible=false);km.forEach(m=>m.material.emissive.setRGB(0,0,0));syncK();zs=lot.reduce((a,r)=>a+CLAYS[r.cl][4],0)/lot.length;ui()}
function boom(){thud();const al=lot.filter(r=>!r.dead),vs=T0<300?al.filter(r=>r.moist>.12):[al.reduce((a,b)=>a.w>b.w?a:b)];vs.forEach(r=>{r.dead=true;const m=km[lot.indexOf(r)];if(m){for(let q=0;q<10;q++){const s=mk(new T.BoxGeometry(.06,.025,.08),std(0xd6946e),m.position.x+(Math.random()-.5)*.4,m.position.y+.2,m.position.z+(Math.random()-.5)*.4,S);s.v=new T.Vector3((Math.random()-.5)*4,Math.random()*3+1,(Math.random()-.5)*4);shards.push(s)}m.visible=false}});risk=0;msg(`💥 ${vs.length} peça(s) estouraram! `+(T0<300?'Ainda tinham água dentro.':'A mais grossa não aguentou a inversão do quartzo.'),6000);if(!lot.some(r=>!r.dead)){st=6;view();ui()}else syncK()}
function scoreP(r){let a=0;for(let i=0;i<N;i++){let m=0,d=0;for(let j=0;j<M;j++)m+=r.rad[i*M+j];m/=M;for(let j=0;j<M;j++)d+=r.md=='mao'?Math.abs(r.rad[i*M+j]-(r.rad[i*M+(j+1)%M]+r.rad[i*M+(j+M-1)%M])/2)*3:Math.abs(r.rad[i*M+j]-m);a+=d/M/m}a/=N;const sym=cl(1-a*7,0,1),th=cl(1-Math.max(0,Math.abs(r.w-.12)-.04)*8,0,1),cov=cl(r.glz.filter(Boolean).length/NV*1.6,0,1),fr=(r.bq=='ok'?.5:.25)+(r.fl==0?.5:.15),hn=r.ty==1||r.ty==2?(r.hd>0?1:.3):1,tp=r.ty==1?(r.hh>.5&&r.hh<.95?1:.5):r.ty==2?(r.hh>.3&&r.hh<.62?1:.5):1;return Math.round(100*(sym*.2+th*.2+cov*.2+fr*.2+hn*.1+tp*.1))}
function endFire(){loading=false;const Z=[-22,0,22];let ok=0,n=0;lot.forEach((r,i)=>{if(r.dead)return;const l=Math.floor(asg[i]/5),p=pk+Z[l]-CLAYS[r.cl][4];n++;if(st==2){r.fired=1;r.bq=p<800?'fraca':p>1050?'passou':'ok';r.rg=.95;r.cc=0;if(r.bq=='ok')ok++}else{r.fired=2;r.fl=p<1030?1:p>1170?2:0;const gl=r.glz.filter(Boolean),ms2=gl.filter(g=>g.t=='m').length/Math.max(1,gl.length);r.rg=r.fl==1?.9:ms2>.5?.6:.12;r.cc=r.fl==0&&ms2<=.5?1:0;if(r.fl==0)ok++}});
lot=lot.filter(r=>!r.dead);km.forEach(m=>S.remove(m));slotM.forEach(m=>S.remove(m));km=[];slotM=[];pot.visible=true;mat.emissive.setRGB(0,0,0);
if(st==2){msg(`Biscoito: ${ok} de ${n} peças perfeitas.`,5000);st=3}else{lot.forEach(r=>r.sc=scoreP(r));msg(`Esmalte: ${ok} de ${n} peças perfeitas ✨`,5000);st=5}ldP(0);view();ui()}
function shelfSave(i){if(lot[i].sv)return msg('Essa peça já está na prateleira.');if(shelfN>=14)return msg('A prateleira está cheia!');const m=new T.Mesh(geo.clone(),mat.clone()),n=shelfN++;lot[i].sv=1;pot.children.forEach(c=>cl2(c,m));m.scale.setScalar(.3);m.position.set(-2.1+(n%7)*.7,n<7?1.36:2.46,-3.15);m.castShadow=true;shelfG.add(m);msg('Peça guardada na prateleira do fundo! ⭐')}
function tick(t){const dt=Math.min(.05,(t-tick.l||0)/1000);tick.l=t;snd(dt);const o=om();rot+=o*dt*.5;pot.rotation.y=rot;head.rotation.y=rot;
rc.setFromCamera(ptr,C);rc.ray.intersectPlane(pln,hp);
let tr=new T.Vector3(.95,1.15,.8),tl=new T.Vector3(-.95,1.15,.8),near=false;
if(st==0||st==3){const ht=st==3&&pressing?rc.intersectObject(pot,false)[0]:null;
if(st==0&&mode=='mao')near=mao(dt,tr,tl);else if(st==0){if(pressing){near=true;if(mode=='torno'){tr.set(hp.x,hp.y,0);tl.set(-hp.x,hp.y,0)}else{tr.set(hp.x,hp.y,Math.sqrt(Math.max(0,.4-hp.x*hp.x)));tl.set(-.9,hp.y,.5)}
if(mode=='torno'&&o>1){water=Math.max(0,water-dt*.06);pot.position.x=0}sculpt(dt,o)}ly=hp.y;
if(w<.05){msg('😱 A parede ficou fina demais e a peça desabou! Barro novo na mesa.');again()}
pot.position.x=mode=='torno'&&o>1?Math.sin(rot*2)*wob*.5:0;if(mode=='torno'){if(gs==0&&wob<.005){gs=1;tool='abrir';ui();msg('Centrado! Agora segure o dedo no meio do topo para abrir o barro.',5000)}else if(gs==1&&f<=8){gs=2;tool='subir';ui();msg('Aberto! Arraste o dedo para cima na parede para subir. Depois use Moldar e Afinar.',6000)}}upd();
$('stat').textContent=tip(o)+`Água ${Math.round(water*100)}% · parede ${w>.17?'grossa':w>.08?'boa':'fina, cuidado!'}${mode=='torno'?(wob>.05?' · barro descentralizado':' · centrado'):''}`}
else{if(ht){near=true;tr.copy(ht.point);tl.set(-.9,1.2,.5);const v=ht.face.a,k=Math.floor(v/M),j=v%M;for(let dk=-1;dk<=1;dk++)for(let dj=-2;dj<=2;dj++){const kk=k+dk;if(kk>0&&kk<=2*N)glz[kk*M+(j+dj+M*2)%M]=GL[gcol]}colr()}
$('stat').textContent='Esmalte cru parece giz: a cor real só aparece depois da queima.'}}
else pot.position.x=0;
if(st==1&&tap&&stp>=0){const h=rc.intersectObject(pot,false)[0];if(h)stampAt(h)}tap=false;if(st==1){$('stat').textContent=`Secagem ${Math.round((1-moist)*100)}%`;if(drying){lot.forEach(r=>r.moist=Math.max(0,r.moist-dt*.33));moist=Math.max(0,moist-dt*.33);colr();if(moist<=0){drying=0;msg('Peça seca! A água dos poros saiu aos poucos, sem pressa.')}}}
if(st==2||st==4){const tg=power>0?power*.25:-(T0-20)*.012;rate+=(tg-rate)*Math.min(1,dt*1.5);T0=Math.max(20,T0+rate*dt);pk=Math.max(pk,T0);
if(st==2){if(T0>100)moist=Math.max(0,moist-dt*.12);const thr=Math.max(3,14-w*35),r1=T0>90&&T0<260&&moist>.12?thr*(1.15-moist):(T0>540&&T0<620?thr*1.4:999);
if(rate>r1)risk+=(rate-r1)*dt*.12;else risk=Math.max(0,risk-dt*.1);if(risk>=1)boom()}

const g=cl((T0-500)/700,0,1);mat.emissive.setRGB(g*.7,g*.2,0);pl.intensity=g*2.2;km.forEach((m,i)=>{if(i!=sel||!loading)m.material.emissive.setRGB(g*.7,g*.2,0)});coils.forEach(c=>c.material.emissive.setRGB(g,g*.35,0));
kupd(dt)}
if(HR.visible){for(const[h,tg,s]of[[HR,tr,1],[HL,tl,-1]]){const p=tg.clone().add(new T.Vector3(s*.3,-.25,.5).setLength(near?.44:.85));h.position.lerp(p,.3);h.lookAt(tg);pose(h)}}
for(const s of shards){s.v.y-=9*dt;s.position.addScaledVector(s.v,dt);s.rotation.x+=dt*5;if(s.position.y<.5){s.position.y=.5;s.v.set(0,0,0)}}
R.render(S,C);requestAnimationFrame(tick)}
S.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true});kilnG.children.forEach(o=>o.castShadow=false);reset();upd();colr();ui();view();msg('Segure o dedo sobre o barro girando para centrar. Depois o jogo guia você 🏺',6000);requestAnimationFrame(tick);
